# Global runtimes (→ ~/.config/mise/config.toml).
# Per project: `mise use node@22` writes a mise.toml in the project folder.

[tools]
node = "lts"
pnpm = "latest"
python = "3.14"
go = "latest"

[settings]
# Also honor what projects already declare:
# .nvmrc / .node-version, and package.json "packageManager" for pnpm
idiomatic_version_file_enable_tools = ["node", "pnpm"]
